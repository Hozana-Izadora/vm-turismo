<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Desafio Ceará — VM Turismo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Cenário (céu, sol, mar e dunas). Uma foto em assets/fotos/capa.jpg, se existir, aparece por cima. -->
  <div class="cena" aria-hidden="true">
    <svg class="cena-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="g-ceu" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#062f4a"/>
          <stop offset="0.45" stop-color="#0b6f93"/>
          <stop offset="0.72" stop-color="#36b6c9"/>
          <stop offset="0.86" stop-color="#ffd59a"/>
        </linearGradient>
        <radialGradient id="g-sol" cx="0.42" cy="0.32" r="0.75">
          <stop offset="0" stop-color="#ffe36e"/>
          <stop offset="0.45" stop-color="#f9a93a"/>
          <stop offset="0.8" stop-color="#e5602b"/>
          <stop offset="1" stop-color="#c8202e"/>
        </radialGradient>
        <linearGradient id="g-mar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#18a9bf"/>
          <stop offset="1" stop-color="#0a5f86"/>
        </linearGradient>
        <linearGradient id="g-areia" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe2b0"/>
          <stop offset="1" stop-color="#f2b872"/>
        </linearGradient>
        <linearGradient id="g-falesia" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6a75c"/>
          <stop offset="0.5" stop-color="#e2733c"/>
          <stop offset="1" stop-color="#b9472c"/>
        </linearGradient>
      </defs>
      <rect width="1000" height="1000" fill="url(#g-ceu)"/>
      <circle class="sol" cx="690" cy="640" r="150" fill="url(#g-sol)" opacity="0.95"/>
      <rect y="700" width="1000" height="300" fill="url(#g-mar)"/>
      <path class="onda onda-1" d="M-100 735 Q -50 720 0 735 T 100 735 T 200 735 T 300 735 T 400 735 T 500 735 T 600 735 T 700 735 T 800 735 T 900 735 T 1000 735 T 1100 735 T 1200 735 T 1300 735 V 1000 H -100 Z" fill="#1fb3c6" opacity="0.6"/>
      <path class="onda onda-2" d="M-100 775 Q -50 760 0 775 T 100 775 T 200 775 T 300 775 T 400 775 T 500 775 T 600 775 T 700 775 T 800 775 T 900 775 T 1000 775 T 1100 775 T 1200 775 T 1300 775 V 1000 H -100 Z" fill="#0f8fb0" opacity="0.7"/>
      <path d="M0 860 C 150 800 260 830 380 850 C 520 875 640 820 780 840 C 880 855 940 870 1000 860 V1000 H0 Z" fill="url(#g-areia)"/>
      <path d="M0 790 C 60 770 120 760 190 775 L 260 880 L 0 900 Z" fill="url(#g-falesia)"/>
      <path d="M0 900 C 200 870 420 930 640 905 C 800 888 900 900 1000 915 V1000 H0 Z" fill="#f7c98a"/>
      <!-- coqueiros -->
      <g class="coqueiro" transform="translate(850 905)">
        <path d="M0 0 C 5 -60 -5 -120 18 -190" stroke="#3a2a1a" stroke-width="9" fill="none" stroke-linecap="round"/>
        <g transform="translate(18 -190)" fill="#1d5a3c">
          <path d="M0 0 C -40 -25 -80 -15 -105 15 C -70 -5 -35 -2 0 0Z"/>
          <path d="M0 0 C 40 -30 85 -20 110 10 C 70 -8 35 -4 0 0Z"/>
          <path d="M0 0 C -15 -45 -50 -65 -80 -60 C -45 -45 -20 -25 0 0Z"/>
          <path d="M0 0 C 20 -45 55 -60 85 -50 C 50 -40 25 -22 0 0Z"/>
          <path d="M0 0 C 5 -40 0 -70 -10 -90 C 10 -70 12 -35 0 0Z"/>
        </g>
      </g>
      <g class="coqueiro" transform="translate(110 905) scale(0.75)">
        <path d="M0 0 C -5 -60 5 -120 -15 -190" stroke="#3a2a1a" stroke-width="9" fill="none" stroke-linecap="round"/>
        <g transform="translate(-15 -190)" fill="#1d5a3c">
          <path d="M0 0 C -40 -25 -80 -15 -105 15 C -70 -5 -35 -2 0 0Z"/>
          <path d="M0 0 C 40 -30 85 -20 110 10 C 70 -8 35 -4 0 0Z"/>
          <path d="M0 0 C -15 -45 -50 -65 -80 -60 C -45 -45 -20 -25 0 0Z"/>
          <path d="M0 0 C 20 -45 55 -60 85 -50 C 50 -40 25 -22 0 0Z"/>
        </g>
      </g>
    </svg>
    <div class="cena-foto"></div>
    <div class="cena-veu"></div>
  </div>

  <main id="app">
    <!-- 1. BOAS-VINDAS -->
    <section class="tela tela-inicio" id="tela-inicio">
      <img class="logo-inicio" id="logo-admin" src="assets/logo-vertical-branco.png" alt="VM Turismo & Receptivo" draggable="false">
      <div class="inicio-titulos">
        <p class="selo" id="txt-evento"></p>
        <h1 class="titulo-desafio" id="txt-titulo"></h1>
        <p class="subtitulo" id="txt-subtitulo"></p>
      </div>
      <div class="faixas-inicio" id="faixas-inicio"></div>
      <button class="btn btn-principal btn-pulsar" id="btn-participar">
        Toque para participar
      </button>
      <p class="rodape-inicio" id="txt-chamada"></p>
    </section>

    <!-- 2. CADASTRO -->
    <section class="tela tela-cadastro" id="tela-cadastro">
      <header class="topo">
        <img class="logo-topo" src="assets/logo-horizontal-branco.png" alt="VM Turismo & Receptivo" draggable="false">
        <ol class="etapas">
          <li class="atual">Cadastro</li><li>Quiz</li><li>Prêmio</li>
        </ol>
      </header>
      <form class="cartao form-cadastro" id="form-cadastro" autocomplete="off" novalidate>
        <div class="cartao-cabecalho">
          <span class="icone-grande" data-icone="palmeira"></span>
          <h2>Prepare-se para o Desafio Ceará!</h2>
          <p>Preencha seus dados para participar da nossa dinâmica de premiações.</p>
        </div>

        <label class="campo">
          <span>Nome completo <b>*</b></span>
          <input id="f-nome" type="text" maxlength="80" placeholder="Digite seu nome" data-teclado="nome" data-proximo="f-telefone" autocomplete="off" spellcheck="false">
          <small class="erro" data-erro="nome"></small>
        </label>
        <label class="campo">
          <span>WhatsApp com DDD <b>*</b></span>
          <input id="f-telefone" type="text" maxlength="15" placeholder="(85) 99999-9999" data-teclado="telefone" data-proximo="f-email" autocomplete="off">
          <small class="erro" data-erro="telefone"></small>
        </label>
        <label class="campo">
          <span>E-mail <b>*</b></span>
          <input id="f-email" type="text" maxlength="100" placeholder="seuemail@empresa.com.br" data-teclado="email" data-proximo="f-empresa" autocomplete="off" autocapitalize="off" spellcheck="false">
          <small class="erro" data-erro="email"></small>
        </label>
        <label class="campo">
          <span>Agência ou empresa <i>(opcional)</i></span>
          <input id="f-empresa" type="text" maxlength="80" placeholder="Nome da empresa" data-teclado="texto" autocomplete="off" spellcheck="false">
        </label>

        <label class="check">
          <input type="checkbox" id="f-consentimento">
          <span class="check-caixa"></span>
          <span class="check-texto"><span id="txt-consentimento"></span>
            <button type="button" class="link" id="btn-aviso">Ler aviso de privacidade</button></span>
        </label>
        <small class="erro" data-erro="consentimento"></small>
        <label class="check">
          <input type="checkbox" id="f-comunicacoes">
          <span class="check-caixa"></span>
          <span class="check-texto" id="txt-comunicacoes"></span>
        </label>

        <div class="acoes">
          <button type="button" class="btn btn-secundario" id="btn-voltar-cadastro">Voltar</button>
          <button type="submit" class="btn btn-principal" id="btn-comecar">Começar o desafio →</button>
        </div>
      </form>
    </section>

    <!-- 3. QUIZ -->
    <section class="tela tela-quiz" id="tela-quiz">
      <header class="topo">
        <img class="logo-topo" src="assets/logo-horizontal-branco.png" alt="VM Turismo & Receptivo" draggable="false">
        <ol class="etapas">
          <li class="feito">Cadastro</li><li class="atual">Quiz</li><li>Prêmio</li>
        </ol>
      </header>
      <div class="cartao cartao-quiz">
        <div class="quiz-cabecalho">
          <div>
            <p class="quiz-contador" id="quiz-contador">Pergunta 1 de 5</p>
            <span class="nivel" id="quiz-nivel">Fácil</span>
          </div>
          <div class="cronometro" id="cronometro">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="crono-fundo" cx="50" cy="50" r="44"/>
              <circle class="crono-barra" id="crono-barra" cx="50" cy="50" r="44"/>
            </svg>
            <span id="crono-num">15</span>
          </div>
        </div>
        <div class="progresso" id="quiz-progresso"></div>
        <h2 class="pergunta" id="quiz-pergunta"></h2>
        <div class="alternativas" id="quiz-alternativas"></div>
        <div class="feedback" id="quiz-feedback" hidden></div>
      </div>
    </section>

    <!-- 4/5. RESULTADO E PREMIAÇÃO -->
    <section class="tela tela-resultado" id="tela-resultado">
      <header class="topo">
        <img class="logo-topo" src="assets/logo-horizontal-branco.png" alt="VM Turismo & Receptivo" draggable="false">
        <ol class="etapas">
          <li class="feito">Cadastro</li><li class="feito">Quiz</li><li class="atual">Prêmio</li>
        </ol>
      </header>
      <div class="cartao cartao-resultado">
        <h2 class="resultado-titulo" id="res-titulo"></h2>
        <div class="placar">
          <div class="placar-item"><strong id="res-acertos"></strong><span>acertos</span></div>
          <div class="placar-item"><strong id="res-pontos"></strong><span>pontos</span></div>
          <div class="placar-item"><strong id="res-tempo"></strong><span>segundos</span></div>
        </div>
        <div class="bolinhas" id="res-bolinhas"></div>
        <div class="premio" id="res-premio"></div>
        <p class="premio-nota" id="res-nota" hidden></p>
        <div class="acoes">
          <button type="button" class="btn btn-secundario" id="btn-entrega">Equipe: confirmar entrega</button>
          <button type="button" class="btn btn-principal" id="btn-concluir">Concluir</button>
        </div>
        <p class="volta-auto" id="res-volta"></p>
      </div>
    </section>

    <!-- ADMINISTRAÇÃO -->
    <section class="tela tela-admin" id="tela-admin">
      <header class="admin-topo">
        <img class="logo-admin" src="assets/logo-horizontal.png" alt="VM Turismo & Receptivo" draggable="false">
        <h1>Painel administrativo</h1>
        <button type="button" class="btn btn-principal btn-pequeno" id="btn-admin-voltar">Voltar ao quiz</button>
      </header>
      <nav class="abas" id="admin-abas">
        <button type="button" data-aba="resumo" class="ativa">Resumo</button>
        <button type="button" data-aba="participantes">Participantes</button>
        <button type="button" data-aba="ranking">Ranking</button>
        <button type="button" data-aba="premios">Prêmios</button>
        <button type="button" data-aba="config">Dados e configurações</button>
      </nav>
      <div class="admin-conteudo" id="admin-conteudo"></div>
    </section>
  </main>

  <div class="modal-fundo" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modal-titulo"></h2>
      <div id="modal-corpo"></div>
      <div class="acoes" id="modal-acoes"></div>
    </div>
  </div>

  <div class="aviso-toast" id="toast" hidden></div>
  <canvas id="confete" aria-hidden="true"></canvas>
  <div id="teclado" class="teclado" hidden></div>

  <script src="js/textos.js"></script>
  <script src="js/perguntas.js"></script>
  <script src="js/util.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/premios.js"></script>
  <script src="js/teclado.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
